name: Build and sign iOS IPA

# Two modes in one workflow so a signed IPA can never be produced from a stale
# binary:
#
#   mode = installable  → compile the Xcode project on this runner, strip the
#                         signature, then sign that fresh binary with the
#                         team's certificate + profile and gate the result.
#   mode = unsigned     → compile and gate the sideload artifact only (no Apple
#                         secrets needed).
#
# The old workflow signed whatever IPA was checked into the repository. That
# file was an Objective-C build and did not match the Swift/SwiftUI sources in
# this repository, so a "successful" signing run published the wrong app.
# Building here makes the signed IPA and the source tree provably the same.
#
# Required repository secrets for mode=installable:
#   IOS_CERT_P12_BASE64               base64 of the .p12 (cert + private key)
#   IOS_CERT_PASSWORD                 password of the .p12
#   IOS_PROVISIONING_PROFILE_BASE64   base64 of the .mobileprovision
#   IOS_TEAM_ID                       Apple Developer Team ID (10 chars)
#
# Never commit the .p12 or the profile. GitHub masks secrets in logs.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to produce
        required: true
        default: installable
        type: choice
        options: [installable, unsigned]
      configuration:
        description: Xcode build configuration
        required: true
        default: Release
        type: choice
        options: [Release, Debug]
      bundle_id:
        description: CFBundleIdentifier the profile must cover
        required: true
        default: com.nbtaimlock.ios

permissions:
  contents: read

env:
  PROJECT: 05_IOS_IPA_SOURCE/NBTAimlock/NBTAimlock.xcodeproj
  SCHEME: NBTAimlock
  APP_NAME: NBTAimlock
  TOOLS: 05_IOS_IPA_SOURCE/tools

jobs:
  build-and-sign:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Assert project inputs exist
        run: |
          set -euo pipefail
          test -d "$PROJECT" || { echo "missing project: $PROJECT" >&2; exit 1; }
          test -f 05_IOS_IPA_SOURCE/NBTAimlock/App/Info.plist || { echo "missing Info.plist" >&2; exit 1; }
          # CFBundleIconName must survive or the compiled asset catalog icon is
          # never referenced and iOS can reject the install.
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" \
            05_IOS_IPA_SOURCE/NBTAimlock/App/Info.plist \
            | grep -qx "AppIcon" || { echo "Info.plist must declare CFBundleIconName=AppIcon" >&2; exit 1; }

      - name: Check secrets for installable build
        if: inputs.mode == 'installable'
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CERT_B64 CERT_PASSWORD PROFILE_B64 TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Build (unsigned)
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          # `tee` needs the directory to exist; a fresh checkout has no build/.
          # With `pipefail` a failed tee would abort the whole build step.
          mkdir -p build
          python3 "$TOOLS/check_swift_sources.py" | tee build/swift_sources.txt
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            clean build | tee build/xcodebuild.log

      - name: Locate built app and assert it is the Swift build
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products -maxdepth 2 -name "$APP_NAME.app" -type d | head -1)"
          test -n "$APP_PATH" || { echo "build produced no $APP_NAME.app" >&2; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"
          # The shipped sources are Swift. If the binary links no Swift runtime
          # the build silently fell back to something stale, and the published
          # IPA would not be the code in this repository. Accept either a real
          # Swift dylib (libswiftCore.dylib) or static __swift5_* metadata —
          # a dynamically linked Swift app always has the former, a static one
          # the latter, and the released binary must have one of them.
          if otool -L "$APP_PATH/$APP_NAME" | grep -q "libswift"; then
            echo "Swift runtime linked in $APP_NAME"
          else
            otool -l "$APP_PATH/$APP_NAME" | grep -q "__swift5_" \
              || { echo "SECURITY: built binary has no Swift runtime or __swift5_* sections — refusing to ship" >&2; exit 1; }
            echo "Swift metadata (__swift5_*) present in $APP_NAME"
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build
          rm -rf build/Payload build/dist
          mkdir -p build/Payload build/dist
          cp -R "$APP_PATH" "build/Payload/$APP_NAME.app"
          # A sideload input must not ship signature material.
          rm -rf "build/Payload/$APP_NAME.app/_CodeSignature"
          rm -f  "build/Payload/$APP_NAME.app/embedded.mobileprovision"
          rm -rf "build/Payload/$APP_NAME.app/SC_Info"
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent \
            build/Payload "build/dist/nbtaimlock-release-unsigned.ipa"

      - name: Gate unsigned IPA
        run: |
          set -euo pipefail
          python3 "$TOOLS/verify_unsigned_ipa.py" \
            build/dist/nbtaimlock-release-unsigned.ipa | tee build/verify.txt

      - name: Upload unsigned IPA
        if: inputs.mode == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: nbtaimlock-unsigned-ipa
          path: |
            build/dist/nbtaimlock-release-unsigned.ipa
            build/verify.txt
            build/xcodebuild.log
          retention-days: 14
          if-no-files-found: error

      # ---------- signing path ----------

      - name: Import signing certificate
        if: inputs.mode == 'installable'
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_B64="$CERT_B64" python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "cert.p12").write_bytes(
              base64.b64decode(os.environ["CERT_B64"])
          )
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install provisioning profile
        if: inputs.mode == 'installable'
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_B64="$PROFILE_B64" python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "profile.mobileprovision").write_bytes(
              base64.b64decode(os.environ["PROFILE_B64"])
          )
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          echo "PROVISIONING_PROFILE=$PROFILE" >> "$GITHUB_ENV"

      - name: Sign the freshly built IPA and validate
        if: inputs.mode == 'installable'
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # Select the identity that belongs to IOS_TEAM_ID, not just the first
          # Apple identity in the keychain: signing with another team's
          # certificate produces an IPA whose signature and profile disagree,
          # and iOS answers "Unable to Install, please try again later".
          IDENTITY="$(security find-identity -v -p codesigning \
            | grep -F "($TEAM_ID)" \
            | head -1 \
            | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "No code-signing identity for team $TEAM_ID in the keychain" >&2
            security find-identity -v -p codesigning >&2
            exit 1
          fi
          echo "Using identity: $IDENTITY"
          export SIGNING_IDENTITY="$IDENTITY"
          bash "$TOOLS/sign_existing_ipa.sh" \
            build/dist/nbtaimlock-release-unsigned.ipa \
            build/nbtaimlock-signed.ipa
          python3 "$TOOLS/validate_ios_release.py" \
            build/nbtaimlock-signed.ipa | tee build/validation.txt

      - name: Write checksum
        if: inputs.mode == 'installable'
        run: |
          set -euo pipefail
          shasum -a 256 build/nbtaimlock-signed.ipa \
            | tee build/nbtaimlock-signed.ipa.sha256
          wc -c < build/nbtaimlock-signed.ipa

      # The Worker serves `public/nbtaimlock-release.ipa` as the first-party
      # install target. Until a signed build is committed there, the deployed
      # `public/nbtaimlock-release.ipa` is the *unsigned* file under the release
      # name — the file an operator pastes into the release form, which then
      # installs nowhere. This step stages the signed build into the exact path
      # the deploy reads and checks it is genuinely different from the unsigned
      # input. It cannot commit from a workflow (no contents:write), so the file
      # is included in the upload below for the operator to commit.
      - name: Stage signed IPA for the deploy
        if: inputs.mode == 'installable'
        run: |
          set -euo pipefail
          mkdir -p REDESIGN_V2/worker/public
          cp build/nbtaimlock-signed.ipa REDESIGN_V2/worker/public/nbtaimlock-release.ipa
          cp build/nbtaimlock-signed.ipa.sha256 REDESIGN_V2/worker/public/nbtaimlock-release.ipa.sha256
          # If the staged file is byte-identical to the unsigned input, signing
          # produced nothing and publishing it would ship the unsigned build
          # under the release name — the exact bug being fixed. Fail instead.
          if cmp -s REDESIGN_V2/worker/public/nbtaimlock-release.ipa build/dist/nbtaimlock-release-unsigned.ipa; then
            echo "Signed IPA is identical to the unsigned input — signing did not happen" >&2
            exit 1
          fi
          python3 "$TOOLS/validate_ios_release.py" \
            REDESIGN_V2/worker/public/nbtaimlock-release.ipa | tee build/validation.txt
          echo "Staged: REDESIGN_V2/worker/public/nbtaimlock-release.ipa ($(wc -c < REDESIGN_V2/worker/public/nbtaimlock-release.ipa) bytes)"

      - name: Upload signed IPA
        if: inputs.mode == 'installable'
        uses: actions/upload-artifact@v4
        with:
          name: nbtaimlock-signed-ipa
          path: |
            build/nbtaimlock-signed.ipa
            build/nbtaimlock-signed.ipa.sha256
            build/validation.txt
            build/verify.txt
            REDESIGN_V2/worker/public/nbtaimlock-release.ipa
            REDESIGN_V2/worker/public/nbtaimlock-release.ipa.sha256
          retention-days: 7
          if-no-files-found: error
